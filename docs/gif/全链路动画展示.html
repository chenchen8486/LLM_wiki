<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>全链路动画展示 · 多媒体信息抽取</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; background: #f7f7f5; color: #22221f; padding: 28px 32px 40px; }
  h1 { font-size: 26px; }
  .lead { font-size: 14.5px; color: #55554f; margin-top: 8px; }
  #tabs { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0 18px; }
  .tab { font-size: 15px; font-weight: 700; border: 1.5px solid #d8d6ce; background: #fff; color: #55554f; border-radius: 999px; padding: 9px 20px; cursor: pointer; }
  .tab:hover { border-color: #285e8a; color: #285e8a; }
  .tab.on { background: #285e8a; border-color: #285e8a; color: #fff; }
  .pane { display: none; }
  .pane.on { display: block; }
  .pane img { width: 100%; max-width: 1600px; border: 1px solid #e2e0d8; border-radius: 10px; background: #fff; display: block; }
  .cap { font-size: 13.5px; color: #9a9a94; margin-top: 10px; }
</style>
</head>
<body>
<h1>全链路动画展示</h1>
<p class="lead">10 篇演示文档（3 主证据 · 3 补充证据 · 3 线索 · 1 丢弃）走完整条管道。六个视角可点按钮切换，各动画数据互相对齐。</p>
<div id="tabs"></div>
<div id="panes"></div>

<script>
const PANES = [
  { id: "p2", tab: "① 总流程图流转", src: "2_全链路流程图流转.gif", cap: "151 帧：10 篇文档随机次序入库，逐篇走完 L0 采集 → 结构化 → 归档 → L1 分级 → 分流 → L1.5 术语对齐 → L2 蒸馏 → L3 图谱，节点计数与元信息卡同步生长。" },
  { id: "p3", tab: "② 元信息卡生命周期", src: "3_元信息卡生命周期.gif", cap: "151 帧：与总流程图同一批 10 篇文档、同一顺序，逐篇看元信息卡随流程逐段生长，分级结论与蒸馏状态全部回写到卡上。" },
  { id: "p4", tab: "③ 线索层三份清单", src: "1_线索层三份清单增量累积.gif", cap: "151 帧：与总流程图同一批 10 篇文档、同一顺序，三份全局清单只由线索层三篇（第 2、6、9 篇）增量合并，终态概念 9 词 · 断言 6 条 · 检索词 6 个，其余篇目过卡时清单不动。" },
  { id: "p5", tab: "④ 术语登记表对齐", src: "5_术语登记表对齐.gif", cap: "151 帧：与总流程图同一批 10 篇文档、同一顺序，逐篇经过 L1.5 术语对齐层，首见建规范条目，异名归并（合并永远人工确认），线索层只进别名，丢弃层不过卡，同名异物拆开登记。" },
  { id: "p6", tab: "⑤ 蒸馏与断言验证", src: "6_蒸馏与断言验证.gif", cap: "151 帧：与总流程图同一批 10 篇文档、同一顺序，主/补逐篇蒸馏出条目进 entries.jsonl（共 40 条），线索层三篇各压出 2 条断言（共 6 条）接受核查，证实 2 · 证伪 2 · 查无 1 · 留待验证 1，证伪落冲突记录、查无落盲区清单。" },
  { id: "p7", tab: "⑥ 终态资产总览", src: "7_终态资产总览.gif", cap: "151 帧：与总流程图同一批 10 篇文档、同一顺序，8 类资产随每篇过卡实时增长：文件夹与元信息卡逐篇 +1，entries 增至 40 条，术语 7 条 · 11 别名，线索清单 9 词 · 6 断言 · 6 检索词，冲突 2 条，盲区 1 项，图谱索引同步增长。" },
];
const tabs = document.getElementById("tabs"), panes = document.getElementById("panes");
PANES.forEach((p, i) => {
  const b = document.createElement("button");
  b.className = "tab" + (i === 0 ? " on" : "");
  b.textContent = p.tab;
  b.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("on"));
    document.querySelectorAll(".pane").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    document.getElementById(p.id).classList.add("on");
  };
  tabs.appendChild(b);
  const d = document.createElement("div");
  d.className = "pane" + (i === 0 ? " on" : "");
  d.id = p.id;
  d.innerHTML = `<img src="${p.src}" alt="${p.tab}"><div class="cap">${p.cap}</div>`;
  panes.appendChild(d);
});
</script>
</body>
</html>
