<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>蒸馏与断言验证（帧动画源稿 v2，与 GIF-2 同源）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; background: #f7f7f5; color: #22221f; }
  #stage { width: 1920px; height: 1080px; padding: 26px 36px 20px; overflow: hidden; position: relative; }
  h1 { font-size: 30px; letter-spacing: .02em; }
  .sub { font-size: 15.5px; color: #55554f; margin-top: 6px; }
  #main { position: relative; height: 880px; margin-top: 12px; }

  .panel { position: absolute; background: #fff; border: 1.5px solid #e2e0d8; border-radius: 12px; padding: 12px 16px; overflow: hidden; }
  .panel.glow { border-color: #285e8a; box-shadow: 0 0 0 4px #e8f0f6; }
  .panel.glow-o { border-color: #d97706; box-shadow: 0 0 0 4px #fdf3e3; }
  .p-head { display: flex; align-items: baseline; gap: 10px; border-bottom: 1px solid #e2e0d8; padding-bottom: 8px; }
  .p-name { font-size: 17px; font-weight: 700; }
  .p-file { font-size: 12.5px; color: #9a9a94; font-family: Consolas, monospace; }
  .p-count { margin-left: auto; font-size: 15px; font-weight: 700; color: #285e8a; background: #e8f0f6; border-radius: 999px; padding: 2px 12px; }

  #entries { left: 0; top: 0; width: 860px; height: 872px; }
  #asserts { left: 890px; top: 0; width: 520px; height: 872px; }
  #conflicts { left: 1440px; top: 0; width: 408px; height: 426px; }
  #blinds { left: 1440px; top: 438px; width: 408px; height: 434px; }

  /* 底部当前文档信息（与圆点排平行，纯信息非表单） */
  #curinfo { margin-left: auto; margin-right: 18px; font-size: 14px; color: #55554f; display: flex; align-items: center; gap: 8px; }
  #curinfo .cil { font-size: 12px; font-weight: 700; color: #9a9a94; letter-spacing: .06em; }
  #curinfo .cdn2 { font-weight: 700; color: #22221f; }
  #curinfo .pill { margin-top: 0; }

  .pill { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 12px; margin-top: 6px; }
  .pill.main { background: #e8f0f6; color: #285e8a; }
  .pill.supp { background: #e9f6ef; color: #1e8e4e; }
  .pill.clue { background: #fdf3e3; color: #d97706; }
  .pill.drop { background: #f1f0eb; color: #9a9a94; }

  .erow { display: flex; align-items: center; gap: 8px; min-height: 34px; font-size: 14px; padding: 3px 6px; border-bottom: 1px solid #f6f5f1; }
  .erow.flash { background: #e8f0f6; border-radius: 6px; }
  .erow.more { color: #9a9a94; font-size: 13px; font-style: italic; min-height: 28px; }
  .eid { font-family: Consolas, monospace; font-size: 12.5px; color: #9a9a94; flex: none; width: 52px; }
  .etype { flex: none; font-size: 11.5px; font-weight: 700; border-radius: 6px; padding: 2px 8px; background: #e8f0f6; color: #285e8a; width: 56px; text-align: center; }
  .etext { flex: 1; min-width: 0; }
  .esrc { flex: none; font-size: 11.5px; color: #9a9a94; }
  .econf { flex: none; font-size: 12px; font-weight: 700; color: #1e8e4e; }
  .econf.mid { color: #d97706; }

  .arow { display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 8px; font-size: 14.5px; border-bottom: 1px solid #f6f5f1; }
  .arow.flash { background: #fdf3e3; border-radius: 6px; }
  .arow.checking { background: #fff8ec; border-radius: 6px; }
  .aid { font-family: Consolas, monospace; font-size: 12.5px; color: #55554f; flex: none; }
  .aclaim { flex: 1; min-width: 0; }
  .st { flex: none; font-size: 12.5px; font-weight: 700; border-radius: 999px; padding: 3px 12px; }
  .st.unverified { background: #fdf3e3; color: #d97706; }
  .st.checking { background: #fff; border: 1.5px dashed #d97706; color: #d97706; }
  .st.confirmed { background: #e9f6ef; color: #1e8e4e; }
  .st.refuted { background: #fdeaea; color: #c0392b; }
  .st.unknown { background: #f1f0eb; color: #77776f; }

  .crow { font-size: 13.5px; padding: 8px 8px; border-bottom: 1px solid #f6f5f1; line-height: 1.5; }
  .crow.flash { background: #fdeaea; border-radius: 6px; }
  .crow .cid2 { font-family: Consolas, monospace; font-size: 12px; color: #c0392b; font-weight: 700; }
  .brow { font-size: 13.5px; padding: 8px 8px; border-bottom: 1px solid #f6f5f1; line-height: 1.5; }
  .brow.flash { background: #fdf3e3; border-radius: 6px; }
  .brow .bid { font-family: Consolas, monospace; font-size: 12px; color: #d97706; font-weight: 700; }
  .empty-note { font-size: 13px; color: #c8c6be; padding: 10px 8px; }

  /* 底部圆点（同批文档进度） */
  #dots { display: flex; gap: 8px; align-items: center; }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #d8d6ce; background: #fff; }
  .dot.done.main { background: #285e8a; border-color: #285e8a; }
  .dot.done.supp { background: #1e8e4e; border-color: #1e8e4e; }
  .dot.done.clue { background: #d97706; border-color: #d97706; }
  .dot.done.drop { background: #9a9a94; border-color: #9a9a94; }
  .dot.cur { border-color: #c0392b; box-shadow: 0 0 0 2px #fdeaea; }

  /* 底部 */
  #foot { display: flex; align-items: center; margin-top: 4px; height: 52px; }
  #flabel { font-size: 17.5px; font-weight: 700; color: #22221f; }
  #flabel .hl { font-size: 24px; color: #c0392b; }
  #fno { position: absolute; right: 38px; bottom: 24px; font-size: 11px; color: #d8d6ce; font-family: Consolas, monospace; }
</style>
</head>
<body>
<div id="stage">
  <h1>蒸馏与断言验证：entries 累积 + 未验证断言的三态闭环</h1>
  <p class="sub">场景：与「总流程图流转」同一批 10 篇文档、同一顺序，主/补证据逐篇蒸馏出条目（左），线索层过卡时压出的断言同步接受核查（中），证伪落冲突记录、查无落盲区清单（右）</p>
  <div id="main">
    <div class="panel" id="entries">
      <div class="p-head"><span class="p-name">蒸馏条目</span><span class="p-file">entries.jsonl</span><span class="p-count" id="cnt-e">0 条</span></div>
      <div id="rows-e"></div>
    </div>
    <div class="panel" id="asserts">
      <div class="p-head"><span class="p-name">断言日志（来自线索层）</span><span class="p-file">assertions.jsonl</span><span class="p-count" id="cnt-a">0 条</span></div>
      <div id="rows-a"></div>
    </div>
    <div class="panel" id="conflicts">
      <div class="p-head"><span class="p-name">冲突记录</span><span class="p-file">conflicts.jsonl</span><span class="p-count" id="cnt-c">0 条</span></div>
      <div id="rows-c"><div class="empty-note">暂无冲突</div></div>
    </div>
    <div class="panel" id="blinds">
      <div class="p-head"><span class="p-name">盲区清单</span><span class="p-file">blind_spots.md</span><span class="p-count" id="cnt-b">0 项</span></div>
      <div id="rows-b"><div class="empty-note">暂无盲区</div></div>
    </div>
  </div>
  <div id="foot"><div id="flabel"></div><div id="curinfo"></div><div id="dots"></div></div>
  <div id="fno"></div>
</div>

<script>
// ---------- 与 GIF-2 同批次同顺序的 10 篇文档 ----------
// n = 本篇蒸馏条数（与总流程图一致）；rep = 代表性展示行；verifies = 本篇触发的断言核查
const DOCS = [
  { name: "CAE IOS 用户手册", kind: "pdf · 487 页", verdict: "main", vlabel: "主证据层", n: 12, rep: [
      { id: "E0001", tp: "功能点", tx: "OAT 外界温度修改：点字段弹键盘、输入 -70~+50°C", conf: "高" },
      { id: "E0002", tp: "UI元素", tx: "SLEW 滑动面板：从 Quick Access 区触发、左滑关闭", conf: "高" },
      { id: "E0003", tp: "流程", tx: "修改参数通用动线：选参数→改值→校验→确认→生效", conf: "高" } ],
    verifies: [] },
  { name: "博客测评文", kind: "网页 · 博客", verdict: "clue", vlabel: "线索层",
    asserts: [ "ast_0001", "ast_0002" ] },
  { name: "培训讲义", kind: "ppt · 86 页", verdict: "supp", vlabel: "补充证据层", n: 4, rep: [
      { id: "E0013", tp: "UI元素", tx: "教案管理页布局（讲义无截图，仅凭文字）", conf: "中" },
      { id: "E0014", tp: "功能点", tx: "课程快照的保存与回滚操作", conf: "中" } ],
    verifies: [] },
  { name: "民航新闻稿", kind: "网页 · 新闻", verdict: "drop", vlabel: "丢弃" },
  { name: "A320 FCOM 节选", kind: "pdf · 210 页", verdict: "main", vlabel: "主证据层", n: 9, rep: [
      { id: "E0017", tp: "约束", tx: "飞行冻结激活时不允许重新定位", conf: "高" },
      { id: "E0018", tp: "功能点", tx: "故障脚本自定义注入（机队演练用）", conf: "高" },
      { id: "E0019", tp: "流程", tx: "标准放行检查单核对动线", conf: "高" } ],
    verifies: [ { t: 13, aid: "ast_0001", to: "confirmed", match: "E0018" },
                { t: 14, aid: "ast_0002", to: "refuted", match: "E0001",
      conflict: { id: "C001", tx: "ast_0002（博客）× E0001（手册）：OAT 上限 +55°C 与 -70~+50°C 矛盾，仲裁以主证据为准" } } ] },
  { name: "播客转录稿", kind: "转录 · 播客", verdict: "clue", vlabel: "线索层",
    asserts: [ "ast_0003", "ast_0004" ] },
  { name: "论坛经验帖", kind: "网页 · 论坛", verdict: "supp", vlabel: "补充证据层", n: 3, rep: [
      { id: "E0026", tp: "功能点", tx: "SLEW 面板实操技巧（教官经验谈）", conf: "中" },
      { id: "E0027", tp: "约束", tx: "训练区域限制的经验值", conf: "中" } ],
    verifies: [ { t: 13, aid: "ast_0004", to: "refuted", match: "E0017",
      conflict: { id: "C002", tx: "ast_0004（播客）× E0017（FCOM）：冻结时可重新定位的说法被主证据否定" } } ] },
  { name: "IOS SDK 接口文档", kind: "pdf · 156 页", verdict: "main", vlabel: "主证据层", n: 7, rep: [
      { id: "E0029", tp: "接口", tx: "IOS 向模拟器核心发送参数指令的接口约定", conf: "高" },
      { id: "E0030", tp: "功能点", tx: "VR 视景配置导出", conf: "高" },
      { id: "E0031", tp: "功能点", tx: "教案版本管理与差异对比", conf: "高" } ],
    verifies: [] },
  { name: "行业综述文章", kind: "网页 · 综述", verdict: "clue", vlabel: "线索层",
    asserts: [ "ast_0005", "ast_0006" ] },
  { name: "旧版手册 v9", kind: "pdf · 402 页", verdict: "supp", vlabel: "补充证据层", n: 5, rep: [
      { id: "E0036", tp: "功能点", tx: "旧版冻结面板入口（v9 布局）", conf: "中" },
      { id: "E0037", tp: "约束", tx: "v9 与现版术语差异对照", conf: "中" } ],
    verifies: [ { t: 13, aid: "ast_0005", to: "confirmed", match: "E0030" } ] },
];

// ---------- 断言账本（6 条全部由线索层三篇压出） ----------
const ASSERTS = {
  ast_0001: { claim: "声称「支持自定义故障脚本」", from: "doc_02 博客" },
  ast_0002: { claim: "声称「OAT 上限 +55°C」", from: "doc_02 博客" },
  ast_0003: { claim: "声称「教案可导出 PDF」", from: "doc_06 播客" },
  ast_0004: { claim: "声称「冻结时仍可重新定位」", from: "doc_06 播客" },
  ast_0005: { claim: "声称「支持导出 VR 视景配置」", from: "doc_09 综述" },
  ast_0006: { claim: "声称「SLEW 面板可手势唤醒」", from: "doc_09 综述" },
};
const AST_ORDER = [ "ast_0001", "ast_0002", "ast_0003", "ast_0004", "ast_0005", "ast_0006" ];
const STXT = { unverified: "未验证", checking: "核查中", confirmed: "证实", refuted: "证伪", unknown: "查无" };
// 结尾盘点：全库蒸馏完毕仍无实据 → 查无落盲区
const OUTRO_RESOLVE = { t: 2, aid: "ast_0003", blind: { id: "B001", tx: "ast_0003：教案导出 PDF 能力，全库主/补证据均未提及，列入盲区待定向采集" } };

// ---------- 与 GIF-2 同步的帧排期 ----------
const INTRO = 5, OUTRO = 8;
const DOCLEN = DOCS.map(d => d.verdict === "drop" ? 9 : d.verdict === "clue" ? 13 : 15);
const TOTAL = INTRO + OUTRO + DOCLEN.reduce((a, b) => a + b, 0);

const P = new URLSearchParams(location.search);
const F = Math.max(0, Math.min(TOTAL - 1, parseInt(P.get("frame") || "0", 10)));

let seg = { type: "intro" }, acc = INTRO;
if (F >= acc) {
  seg = null;
  for (let i = 0; i < DOCS.length; i++) {
    if (F < acc + DOCLEN[i]) { seg = { type: "doc", idx: i, t: F - acc }; break; }
    acc += DOCLEN[i];
  }
  if (!seg) seg = { type: "outro" };
}

// ---------- 累计状态 ----------
const entries = [], conflicts = [], blinds = [];
const appeared = new Set();                       // 已进日志的断言
const astate = {}; AST_ORDER.forEach(a => astate[a] = "unverified");
const flashE = new Set(), flashA = new Set(), flashC = new Set(), flashB = new Set();
let checkingAid = null;

function applyDistill(d, full) {
  d.rep.forEach(e => { if (!entries.find(x => x.id === e.id)) { entries.push(e); if (!full) flashE.add(e.id); } });
  d._counted = true;
}
function applyVerify(v, phase) {
  // phase: 0 核查中, 1 定论
  if (phase === 0) { checkingAid = v.aid; return; }
  astate[v.aid] = v.to; checkingAid = null; flashA.add(v.aid); if (v.match) flashE.add(v.match);
  if (v.conflict && !conflicts.find(x => x.id === v.conflict.id)) { conflicts.push(v.conflict); flashC.add(v.conflict.id); }
}

// 已完结篇目全量回放
const doneUpto = seg.type === "doc" ? seg.idx : (seg.type === "outro" ? DOCS.length : 0);
for (let i = 0; i < doneUpto; i++) {
  const d = DOCS[i];
  if (d.n) applyDistill(d, true);
  if (d.asserts) d.asserts.forEach(a => appeared.add(a));
  (d.verifies || []).forEach(v => { astate[v.aid] = v.to; if (v.conflict) conflicts.push(v.conflict); });
}

// 当前篇按 t 施加
if (seg.type === "doc") {
  const d = DOCS[seg.idx], t = seg.t;
  if (d.asserts) d.asserts.forEach((a, j) => { if (t >= 9 + j) { if (!appeared.has(a)) { appeared.add(a); flashA.add(a); } } });
  if (d.n && t >= 11) applyDistill(d, false);
  (d.verifies || []).forEach(v => { if (t >= v.t) applyVerify(v, 1); else if (t === v.t - 1) applyVerify(v, 0); });
} else if (seg.type === "outro") {
  const t = seg.t = F - (TOTAL - OUTRO);
  if (t === OUTRO_RESOLVE.t - 1) checkingAid = OUTRO_RESOLVE.aid;
  if (t >= OUTRO_RESOLVE.t) {
    astate[OUTRO_RESOLVE.aid] = "unknown"; checkingAid = null; flashA.add(OUTRO_RESOLVE.aid);
    if (!blinds.find(x => x.id === OUTRO_RESOLVE.blind.id)) { blinds.push(OUTRO_RESOLVE.blind); flashB.add(OUTRO_RESOLVE.blind.id); }
  }
}

// ---------- 渲染 ----------
let ehtml = "", ecount = 0;
DOCS.forEach((d, i) => {
  if (!d._counted) return;
  ecount += d.n;
  const cur = seg.type === "doc" && seg.idx === i;
  d.rep.forEach(e => {
    ehtml += `<div class="erow ${flashE.has(e.id) ? "flash" : ""}"><span class="eid">${e.id}</span><span class="etype">${e.tp}</span><span class="etext">${e.tx}</span><span class="esrc">doc_${String(i + 1).padStart(2, "0")}</span><span class="econf ${e.conf === "中" ? "mid" : ""}">置信${e.conf}</span></div>`;
  });
  if (d.n > d.rep.length) ehtml += `<div class="erow more">… 同批另 ${d.n - d.rep.length} 条已入库（doc_${String(i + 1).padStart(2, "0")} 共产出 ${d.n} 条）</div>`;
});
document.getElementById("rows-e").innerHTML = ehtml || '<div class="empty-note">等待主/补证据到达蒸馏层…</div>';
document.getElementById("cnt-e").textContent = ecount + " 条";

document.getElementById("rows-a").innerHTML = AST_ORDER.filter(a => appeared.has(a)).map(a => {
  const st = checkingAid === a ? "checking" : astate[a];
  return `<div class="arow ${flashA.has(a) ? "flash" : checkingAid === a ? "checking" : ""}"><span class="aid">${a}</span><span class="aclaim">${ASSERTS[a].claim}<span style="color:#c8c6be;font-size:12px">　${ASSERTS[a].from}</span></span><span class="st ${st}">${STXT[st]}</span></div>`;
}).join("") || '<div class="empty-note">等待线索层文档过卡…</div>';
document.getElementById("cnt-a").textContent = appeared.size + " 条";

document.getElementById("rows-c").innerHTML = conflicts.length
  ? conflicts.map(c => `<div class="crow ${flashC.has(c.id) ? "flash" : ""}"><span class="cid2">${c.id}</span> ${c.tx}</div>`).join("")
  : '<div class="empty-note">暂无冲突</div>';
document.getElementById("cnt-c").textContent = conflicts.length + " 条";
document.getElementById("rows-b").innerHTML = blinds.length
  ? blinds.map(b => `<div class="brow ${flashB.has(b.id) ? "flash" : ""}"><span class="bid">${b.id}</span> ${b.tx}</div>`).join("")
  : '<div class="empty-note">暂无盲区</div>';
document.getElementById("cnt-b").textContent = blinds.length + " 项";

// 面板发光
if (seg.type === "doc") {
  const d = DOCS[seg.idx], t = seg.t;
  if (d.n && t >= 11 && t <= 12) document.getElementById("entries").classList.add("glow");
  if ((d.verifies || []).some(v => t >= v.t - 1)) document.getElementById("asserts").classList.add("glow-o");
  if ((d.verifies || []).some(v => v.conflict && t >= v.t)) document.getElementById("conflicts").classList.add("glow-o");
  if (d.asserts && t >= 9) document.getElementById("asserts").classList.add("glow-o");
} else if (seg.type === "outro" && seg.t >= OUTRO_RESOLVE.t) {
  document.getElementById("blinds").classList.add("glow-o");
}

// 底部当前文档信息（圆点排左侧）
const curEl = document.getElementById("curinfo");
if (seg.type === "doc") {
  const d = DOCS[seg.idx];
  curEl.innerHTML = `<span class="cil">当前</span><span class="cdn2">${seg.idx + 1}. ${d.name}</span><span>${d.kind}</span><span class="pill ${d.verdict}">${d.vlabel}</span>`;
} else {
  curEl.innerHTML = `<span class="cil">${seg.type === "intro" ? "等待文档入库…" : "10 篇处理完毕"}</span>`;
}
// 底部圆点
const dotsEl = document.getElementById("dots");
DOCS.forEach((d, i) => {
  const cls = seg.type === "outro" ? "dot done " + d.verdict
    : seg.type === "doc" ? (i < seg.idx ? "dot done " + d.verdict : i === seg.idx ? "dot cur" : "dot")
    : "dot";
  dotsEl.innerHTML += `<span class="${cls}"></span>`;
});

// ---------- 底部标签 ----------
const flabel = document.getElementById("flabel");
if (seg.type === "intro") {
  flabel.textContent = "建仓：线索层断言随过卡陆续进日志，主/补证据的蒸馏产物负责核查它们";
} else if (seg.type === "outro") {
  if (seg.t < OUTRO_RESOLVE.t - 1) flabel.textContent = "全部文档过卡完毕：盘点仍无实据的未决断言";
  else if (seg.t < OUTRO_RESOLVE.t) flabel.innerHTML = `盘点未决断言：<span class="hl">ast_0003 核查中，全库翻检</span>`;
  else if (seg.t < OUTRO_RESOLVE.t + 2) flabel.innerHTML = `ast_0003 全库查无实据：<span class="hl">判定查无，落盲区清单</span>`;
  else {
    const c = AST_ORDER.filter(a => astate[a] === "confirmed").length;
    const r = AST_ORDER.filter(a => astate[a] === "refuted").length;
    const u = AST_ORDER.filter(a => astate[a] === "unknown").length;
    flabel.textContent = `终态：蒸馏条目 ${ecount} 条；断言 证实 ${c} · 证伪 ${r} · 查无 ${u} · 留待验证 ${AST_ORDER.length - c - r - u}；冲突 ${conflicts.length} 条、盲区 ${blinds.length} 项`;
  }
} else {
  const d = DOCS[seg.idx], t = seg.t;
  let PH;
  if (d.verdict === "drop") {
    PH = t <= 6 ? "前段流程处理中" : "分流为丢弃：不蒸馏、不产断言，四张表不动";
  } else if (d.verdict === "clue") {
    PH = t <= 8 ? "前段流程处理中" : t <= 10 ? "线索层过卡：压出 2 条断言进日志（未验证）" : "本篇贡献完毕，断言等待后续证据核查";
  } else {
    const vs = (d.verifies || []).filter(x => t >= x.t);
    const v = vs[vs.length - 1];
    const vNext = (d.verifies || []).find(x => t === x.t - 1);
    if (v) {
      const claim = ASSERTS[v.aid].claim;
      PH = v.to === "confirmed" ? `核查 ${v.aid}：${claim} → 证实（实据 ${v.match}）`
        : `核查 ${v.aid}：${claim} → 证伪（与 ${v.match} 矛盾，落冲突记录）`;
    } else if (vNext) PH = `核查 ${vNext.aid}：翻检已入库条目…`;
    else if (t <= 8) PH = "前段流程处理中，尚未到达蒸馏层";
    else if (t <= 10) PH = "L1.5 术语对齐中，条目尚未产出";
    else if (t <= 12) PH = `L2 蒸馏中：本篇产出 ${d.n} 条 JSON 条目`;
    else PH = "本篇定格，条目全部入库";
  }
  flabel.innerHTML = `第 ${seg.idx + 1} 篇 / 共 10 篇 · ${d.name}：<span class="hl">${PH}</span>`;
}

document.getElementById("fno").textContent = "frame " + F + " / " + (TOTAL - 1);
</script>
