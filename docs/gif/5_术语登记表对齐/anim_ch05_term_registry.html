<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>术语登记表对齐过程（帧动画源稿 v2，与 GIF-2 同源）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; background: #f7f7f5; color: #22221f; }
  #stage { width: 1920px; height: 1080px; padding: 26px 36px 20px; overflow: hidden; position: relative; }
  h1 { font-size: 30px; letter-spacing: .02em; }
  .sub { font-size: 15.5px; color: #55554f; margin-top: 6px; }
  #main { position: relative; height: 880px; margin-top: 12px; }

  /* 左：术语登记表（主内容，加宽加大） */
  #reg { position: absolute; left: 0; top: 0; width: 1390px; height: 872px; background: #fff; border: 1.5px solid #e2e0d8; border-radius: 14px; padding: 20px 28px; }
  .reg-head { display: flex; align-items: baseline; gap: 12px; }
  .reg-title { font-size: 21px; font-weight: 700; }
  .reg-file { font-size: 13px; color: #9a9a94; font-family: Consolas, monospace; }
  .reg-count { margin-left: auto; font-size: 17px; font-weight: 700; color: #285e8a; background: #e8f0f6; border-radius: 999px; padding: 2px 16px; }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; }
  th { font-size: 14.5px; color: #9a9a94; text-align: left; padding: 10px 10px; border-bottom: 2px solid #f1f0eb; font-weight: 700; }
  td { font-size: 17.5px; padding: 14px 10px; border-bottom: 1px solid #f1f0eb; vertical-align: middle; }
  tr.trow.flash { background: #fdf3e3; }
  .tid { font-family: Consolas, monospace; font-size: 15px; color: #9a9a94; }
  .tname { font-weight: 700; font-size: 19px; }
  .alias { display: inline-block; font-size: 14.5px; background: #f1f0eb; border-radius: 8px; padding: 3px 10px; margin: 2px 4px 2px 0; }
  .alias.new { background: #fdf3e3; color: #d97706; font-weight: 700; }
  .alias.pending { background: #fff; border: 1.5px dashed #d97706; color: #d97706; font-weight: 700; }
  .src { font-size: 14.5px; color: #55554f; }
  .ok { font-size: 14px; font-weight: 700; color: #1e8e4e; }
  .amb { font-size: 14px; font-weight: 700; color: #d97706; }

  /* 右：窄栏（流程位置 + 当前文档 + 术语去向） */
  #side { position: absolute; left: 1422px; top: 0; width: 426px; }
  .panel-title { font-size: 15px; font-weight: 700; color: #55554f; margin-bottom: 10px; letter-spacing: .06em; }
  .step { display: flex; align-items: center; gap: 10px; background: #fff; border: 1.5px solid #e2e0d8; border-radius: 10px; padding: 6px 12px; margin-bottom: 6px; opacity: .45; }
  .step .sn { width: 22px; height: 22px; border-radius: 50%; background: #f1f0eb; color: #9a9a94; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .step .sname { font-size: 14.5px; font-weight: 700; }
  .step .ssub { font-size: 11.5px; color: #9a9a94; }
  .step.done { opacity: 1; }
  .step.done .sn { background: #1e8e4e; color: #fff; }
  .step.cur { opacity: 1; border-color: #c0392b; box-shadow: 0 0 0 2px #fdeaea; }
  .step.cur .sn { background: #c0392b; color: #fff; }

  #docbox { background: #fff; border: 1.5px solid #e2e0d8; border-radius: 10px; padding: 10px 14px; margin-top: 10px; }
  #docbox .dn { font-size: 16px; font-weight: 700; }
  #docbox .dk { font-size: 12px; color: #9a9a94; margin-top: 2px; }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 12px; margin-top: 6px; }
  .pill.main { background: #e8f0f6; color: #285e8a; }
  .pill.supp { background: #e9f6ef; color: #1e8e4e; }
  .pill.clue { background: #fdf3e3; color: #d97706; }
  .pill.drop { background: #f1f0eb; color: #9a9a94; }
  #terms { margin-top: 10px; background: #fff; border: 1.5px solid #e2e0d8; border-radius: 10px; padding: 10px 14px; min-height: 132px; }
  #terms .tt { font-size: 13px; font-weight: 700; color: #55554f; margin-bottom: 2px; }
  .tchip { display: flex; align-items: center; gap: 8px; height: 34px; font-size: 15.5px; font-weight: 700; opacity: 0; }
  .tchip.on { opacity: 1; }
  .tchip .arrow { color: #9a9a94; font-weight: 400; }
  .tchip .act { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 10px; }
  .act.add { background: #e9f6ef; color: #1e8e4e; }
  .act.merge { background: #fdf3e3; color: #d97706; }
  #note { margin-top: 8px; font-size: 12.5px; color: #9a9a94; min-height: 32px; line-height: 1.45; }

  /* 底部 */
  #foot { display: flex; align-items: center; margin-top: 4px; height: 52px; }
  #flabel { font-size: 17.5px; font-weight: 700; color: #22221f; }
  #flabel .hl { font-size: 24px; color: #c0392b; }
  /* 同批文档清单（与 GIF-3 同款） */
  .drow { display: flex; align-items: center; gap: 7px; height: 23px; font-size: 12.5px; color: #9a9a94; }
  .drow.cur { color: #22221f; font-weight: 700; }
  .drow .ddot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid #d8d6ce; background: #fff; flex: none; }
  .drow.done .ddot.main { background: #285e8a; border-color: #285e8a; }
  .drow.done .ddot.supp { background: #1e8e4e; border-color: #1e8e4e; }
  .drow.done .ddot.clue { background: #d97706; border-color: #d97706; }
  .drow.done .ddot.drop { background: #9a9a94; border-color: #9a9a94; }
  .drow.cur .ddot { border-color: #c0392b; box-shadow: 0 0 0 2px #fdeaea; }
  #fno { position: absolute; right: 38px; bottom: 24px; font-size: 11px; color: #d8d6ce; font-family: Consolas, monospace; }
</style>
</head>
<body>
<div id="stage">
  <h1>术语登记表：跨文档叫法统一的累积过程</h1>
  <p class="sub">场景：与「总流程图流转」同一批 10 篇文档、同一顺序，逐篇经过 L1.5 术语对齐层，首见建规范条目，异名归并（合并永远人工确认），线索层只进别名，丢弃层不过卡</p>
  <div id="main">
    <div id="reg">
      <div class="reg-head">
        <span class="reg-title">术语登记表</span>
        <span class="reg-file">term_registry.yaml</span>
        <span class="reg-count" id="cnt">0 条</span>
      </div>
      <table>
        <thead><tr><th style="width:90px">编号</th><th style="width:160px">规范名</th><th>别名（各文档里的叫法）</th><th style="width:200px">首见来源</th><th style="width:130px">状态</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="side">
      <div class="panel-title">流程位置</div>
      <div class="step" id="step0"><span class="sn">1</span><div><div class="sname">L0 归档 / L1 分级</div><div class="ssub">登记静态字段 · 三维打分</div></div></div>
      <div class="step" id="step1"><span class="sn">2</span><div><div class="sname">分流</div><div class="ssub">layer 标签落定</div></div></div>
      <div class="step" id="step2"><span class="sn">3</span><div><div class="sname">L1.5 术语对齐</div><div class="ssub">本篇术语逐个判定去向</div></div></div>
      <div class="step" id="step3"><span class="sn">4</span><div><div class="sname">L2 蒸馏</div><div class="ssub">主/补继续，其余止步</div></div></div>
      <div id="docbox"></div>
      <div id="terms"><div class="tt">本篇术语 → 去向</div><div id="tlist"></div></div>
      <div id="note"></div>
      <div id="dlist"></div>
    </div>
  </div>
  <div id="foot">
    <div id="flabel"></div>
  </div>
  <div id="fno"></div>
</div>

<script>
// ---------- 与 GIF-2 同批次同顺序的 10 篇文档 ----------
const DOCS = [
  { name: "CAE IOS 用户手册", kind: "pdf · 487 页", verdict: "main", vlabel: "主证据层",
    terms: [ { w: "教案", act: "add", id: "T0001", name: "教案", alias: ["Lesson Plan"], src: "doc_01 手册" },
             { w: "飞行冻结", act: "add", id: "T0002", name: "飞行冻结", alias: ["Flight Freeze"], src: "doc_01 手册" },
             { w: "OAT", act: "add", id: "T0003", name: "OAT", alias: ["外界温度"], src: "doc_01 手册" } ] },
  { name: "博客测评文", kind: "网页 · 博客", verdict: "clue", vlabel: "线索层",
    terms: [ { w: "LP", act: "merge", id: "T0001" },
             { w: "FF", act: "merge", id: "T0002" } ],
    note: "线索层只登记别名，永不进证据链" },
  { name: "培训讲义", kind: "ppt · 86 页", verdict: "supp", vlabel: "补充证据层",
    terms: [ { w: "训练课程", act: "merge", id: "T0001" },
             { w: "课程快照", act: "add", id: "T0004", name: "课程快照", alias: [], src: "doc_03 讲义" } ],
    note: "LLM 提示「训练课程 ≈ 教案」，合并建议人工确认通过" },
  { name: "民航新闻稿", kind: "网页 · 新闻", verdict: "drop", vlabel: "丢弃", terms: [],
    note: "分流为丢弃：不经过对齐层，登记表不变" },
  { name: "A320 FCOM 节选", kind: "pdf · 210 页", verdict: "main", vlabel: "主证据层",
    terms: [ { w: "滑动面板", act: "add", id: "T0005", name: "滑动面板", alias: [], src: "doc_05 FCOM" },
             { w: "SLEW", act: "merge", id: "T0005" } ] },
  { name: "播客转录稿", kind: "转录 · 播客", verdict: "clue", vlabel: "线索层",
    terms: [ { w: "FLT FRZ", act: "merge", id: "T0002" } ],
    note: "线索层只登记别名，永不进证据链" },
  { name: "论坛经验帖", kind: "网页 · 论坛", verdict: "supp", vlabel: "补充证据层",
    terms: [ { w: "Slew Panel", act: "merge", id: "T0005" } ] },
  { name: "IOS SDK 接口文档", kind: "pdf · 156 页", verdict: "main", vlabel: "主证据层",
    terms: [ { w: "燃油冻结", act: "add", id: "T0006", name: "燃油冻结", alias: [], src: "doc_08 SDK" } ],
    note: "同名异物辨析：「冻结」拆为 飞行冻结（T0002）与 燃油冻结（T0006）" },
  { name: "行业综述文章", kind: "网页 · 综述", verdict: "clue", vlabel: "线索层",
    terms: [ { w: "课程计划", act: "merge", id: "T0001" } ],
    note: "线索层只登记别名，永不进证据链" },
  { name: "旧版手册 v9", kind: "pdf · 402 页", verdict: "supp", vlabel: "补充证据层",
    terms: [ { w: "重新定位", act: "add", id: "T0007", name: "重新定位", alias: ["REPOS"], src: "doc_10 旧手册" } ] },
];

// ---------- 与 GIF-2 同步的帧排期：主/补 15 帧、线索 13 帧、丢弃 9 帧 ----------
const INTRO = 5, OUTRO = 8;
const DOCLEN = DOCS.map(d => d.verdict === "drop" ? 9 : d.verdict === "clue" ? 13 : 15);
const TOTAL = INTRO + OUTRO + DOCLEN.reduce((a, b) => a + b, 0);

const P = new URLSearchParams(location.search);
const F = Math.max(0, Math.min(TOTAL - 1, parseInt(P.get("frame") || "0", 10)));

let seg = { type: "intro" }, acc = INTRO;
if (F >= acc) {
  seg = null;
  for (let i = 0; i < DOCS.length; i++) {
    if (F < acc + DOCLEN[i]) { seg = { type: "doc", idx: i, t: F - acc }; break; }
    acc += DOCLEN[i];
  }
  if (!seg) seg = { type: "outro" };
}

// ---------- 术语事件时刻：主/补 t9 起逐词出现、t12 落表（合并挂待确认）、t13 确认；线索 t9 起、t11 落表、t12 确认 ----------
function evTimes(d) {
  if (d.verdict === "clue") return { show: 9, land: 11, confirm: 12 };
  return { show: 9, land: 12, confirm: 13 };
}

// ---------- 登记表状态 ----------
const REG = [];  // {id, name, alias:[{t, st}], src}
const flashRow = new Set(), newAlias = new Set(), pendAlias = new Set();
let recording = false;

function applyTerm(tm, mode) {
  if (tm.act === "add") {
    REG.push({ id: tm.id, name: tm.name, alias: tm.alias.map(a => ({ t: a, st: "ok" })), src: tm.src });
    if (recording) flashRow.add(tm.id);
  } else if (tm.act === "merge") {
    const r = REG.find(x => x.id === tm.id);
    if (r) {
      r.alias.push({ t: tm.w, st: mode === "pending" ? "pending" : "ok" });
      if (recording) {
        flashRow.add(tm.id);
        if (mode === "pending") pendAlias.add(tm.id + "|" + tm.w);
        else newAlias.add(tm.id + "|" + tm.w);
      }
    }
  }
}
function confirmAllPending() {
  REG.forEach(r => r.alias.forEach(a => {
    if (a.st === "pending") {
      a.st = "ok";
      if (recording) {
        pendAlias.delete(r.id + "|" + a.t);
        newAlias.add(r.id + "|" + a.t);
        flashRow.add(r.id);
      }
    }
  }));
}

const doneUpto = seg.type === "doc" ? seg.idx : (seg.type === "outro" ? DOCS.length : 0);
for (let i = 0; i < doneUpto; i++) DOCS[i].terms.forEach(tm => applyTerm(tm, "confirm"));

if (seg.type === "doc") {
  recording = true;
  const d = DOCS[seg.idx], t = seg.t, ev = evTimes(d);
  if (t >= ev.land) d.terms.forEach(tm => applyTerm(tm, tm.act === "merge" ? "pending" : "confirm"));
  if (t >= ev.confirm) confirmAllPending();
  recording = false;
}

// ---------- 渲染登记表 ----------
const rowsEl = document.getElementById("rows");
REG.forEach(r => {
  const tr = document.createElement("tr");
  tr.className = "trow" + (flashRow.has(r.id) ? " flash" : "");
  const aliases = r.alias.map(a => {
    const key = r.id + "|" + a.t;
    const cls = pendAlias.has(key) ? "alias pending" : newAlias.has(key) ? "alias new" : "alias";
    return `<span class="${cls}">${a.t}${pendAlias.has(key) ? "（待确认）" : ""}</span>`;
  }).join("");
  const splitDone = REG.some(x => x.id === "T0006");
  const amb = splitDone && (r.id === "T0002" || r.id === "T0006");
  tr.innerHTML = `<td class="tid">${r.id}</td><td class="tname">${r.name}</td><td>${aliases || '<span style="color:#d8d6ce">—</span>'}</td><td class="src">${r.src}</td><td class="${amb ? "amb" : "ok"}">${amb ? "歧义已拆" : "已确认"}</td>`;
  rowsEl.appendChild(tr);
});
document.getElementById("cnt").textContent = REG.length + " 条";

// ---------- 右侧与底部 ----------
const flabel = document.getElementById("flabel");
const dlist = document.getElementById("dlist");
dlist.innerHTML = '<div class="panel-title" style="margin-top:10px">同批文档（与总流程图一致）</div>';
DOCS.forEach((d, i) => {
  dlist.innerHTML += `<div class="drow" id="drow${i}"><span class="ddot ${d.verdict}"></span><span>${i + 1}. ${d.name}</span></div>`;
});

if (seg.type === "doc") {
  const d = DOCS[seg.idx], t = seg.t, ev = evTimes(d);
  // 流程位置：与 GIF-3 同映射（t<=4 前段、5-6 分级、7-8 分流、9+ 对齐/蒸馏）
  const cur = t <= 6 ? 0 : t <= 8 ? 1 : (d.verdict === "main" || d.verdict === "supp") && t >= 14 ? 3 : 2;
  for (let i = 0; i < 4; i++) {
    const el = document.getElementById("step" + i);
    if (i < cur) el.classList.add("done");
    else if (i === cur) el.classList.add("cur");
  }
  document.getElementById("docbox").innerHTML =
    `<div class="dn">${seg.idx + 1}. ${d.name}</div><div class="dk">${d.kind}</div><span class="pill ${d.verdict}">${d.vlabel}</span>`;
  document.getElementById("tlist").innerHTML = d.terms.length === 0
    ? '<div style="color:#9a9a94;font-size:14px;padding:8px 0">本篇不过卡，无术语事件</div>'
    : d.terms.map((tm, j) => {
        const on = t >= ev.show + j;
        const actLabel = tm.act === "add" ? '<span class="act add">新建条目</span>'
          : `<span class="act merge">归并 → ${tm.id}</span>`;
        return `<div class="tchip ${on ? "on" : ""}"><span>${tm.w}</span><span class="arrow">→</span>${actLabel}</div>`;
      }).join("");
  document.getElementById("note").textContent = (t >= ev.land && d.note) ? d.note : "";
  DOCS.forEach((dd, i) => {
    const el = document.getElementById("drow" + i);
    if (i < seg.idx) el.classList.add("done");
    else if (i === seg.idx) el.classList.add("cur");
  });
  const PH = d.verdict === "drop"
    ? (t <= 6 ? "前段流程处理中" : "分流为丢弃，不到达对齐层，登记表不变")
    : t <= 8 ? "前段流程处理中，尚未到达对齐层"
    : t < ev.land ? `到达对齐层，逐词判定去向（${d.terms.length} 个候选）`
    : t < ev.confirm ? (d.terms.some(tm => tm.act === "merge") ? "落表登记，合并项挂待确认" : "落表登记，新条目生效")
    : d.terms.some(tm => tm.act === "merge") ? "人工确认通过，别名生效，本篇定格" : "本篇处理完毕，条目定格";
  flabel.innerHTML = `第 ${seg.idx + 1} 篇 / 共 10 篇 · ${d.name}：<span class="hl">${PH}</span>`;
} else if (seg.type === "intro") {
  document.getElementById("docbox").innerHTML = '<div style="color:#9a9a94;font-size:14px">等待文档进入对齐层…</div>';
  document.getElementById("tlist").innerHTML = "";
  flabel.textContent = "建库：术语登记表为空，10 篇文档将按同一顺序陆续过卡";
} else {
  document.getElementById("docbox").innerHTML = '<div style="color:#9a9a94;font-size:14px">10 篇处理完毕</div>';
  document.getElementById("tlist").innerHTML = "";
  for (let i = 0; i < 4; i++) document.getElementById("step" + i).classList.add("done");
  DOCS.forEach((dd, i) => document.getElementById("drow" + i).classList.add("done"));
  const aliasCnt = REG.reduce((s, r) => s + r.alias.length, 0);
  flabel.textContent = `终态：规范条目 ${REG.length} 条、别名 ${aliasCnt} 个，同名异物已拆分，合并全部经人工确认`;
}

document.getElementById("fno").textContent = "frame " + F + " / " + (TOTAL - 1);
</script>
</body>
</html>
