<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>播放器 demo A：单视角 + 分镜切换</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; background: #f7f7f5; color: #22221f; padding: 24px 32px; }
  h1 { font-size: 24px; }
  .tabs { display: flex; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
  .tab { font-size: 15px; font-weight: 700; padding: 7px 18px; border-radius: 999px; border: 1.5px solid #d8d6ce; background: #fff; cursor: pointer; color: #55554f; }
  .tab.cur { border-color: #c0392b; color: #c0392b; background: #fdf7f6; }
  #view { width: 100%; max-width: 1500px; background: #fff; border: 1.5px solid #e2e0d8; border-radius: 12px; overflow: hidden; }
  #view img { display: block; width: 100%; }
  #ctrl { display: flex; align-items: center; gap: 14px; max-width: 1500px; margin-top: 12px; background: #fff; border: 1.5px solid #e2e0d8; border-radius: 12px; padding: 10px 16px; }
  .btn { font-size: 15px; font-weight: 700; border: 1.5px solid #d8d6ce; background: #fff; border-radius: 8px; padding: 5px 14px; cursor: pointer; }
  .btn:hover { border-color: #285e8a; color: #285e8a; }
  #play { min-width: 74px; }
  #bar { flex: 1; -webkit-appearance: none; appearance: none; height: 6px; background: #e2e0d8; border-radius: 999px; cursor: pointer; }
  #bar::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #c0392b; cursor: pointer; }
  #fno { font-family: Consolas, monospace; font-size: 14px; color: #55554f; min-width: 96px; text-align: right; }
  #spd { font-size: 13.5px; color: #55554f; }
  #flabel { max-width: 1500px; margin-top: 10px; font-size: 16px; font-weight: 700; }
  #cap { max-width: 1500px; margin-top: 8px; font-size: 14px; color: #55554f; line-height: 1.6; }
</style>
</head>
<body>
<h1>全链路动画播放器（demo A）</h1>
<div class="tabs" id="tabs"></div>
<div id="view"><img id="img" alt=""></div>
<div id="ctrl">
  <button class="btn" id="play">▶ 播放</button>
  <button class="btn" id="prev">⏮ -1</button>
  <button class="btn" id="next">+1 ⏭</button>
  <input type="range" id="bar" min="0" max="150" value="0">
  <span id="fno">f000 / 150</span>
  <span id="spd">速度 1x</span>
</div>
<div id="flabel"></div>
<div id="cap"></div>

<script>
const VIEWS = [
  { tab: "① 总流程图流转", dir: "2_全链路流程图流转", cap: "10 篇文档依次走完归档、分级、分流、对齐、蒸馏、图谱全链路，红框标出当前篇位置。" },
  { tab: "② 元信息卡生命周期", dir: "3_元信息卡生命周期", cap: "每篇文档一张卡，静态字段先登记，分级结论与蒸馏状态逐段回写。" },
  { tab: "③ 线索层三份清单", dir: "1_线索层三份清单增量累积", cap: "只有线索层三篇向概念清单、断言日志、检索词表追加内容，其余篇目清单不动。" },
  { tab: "④ 术语登记表对齐", dir: "5_术语登记表对齐", cap: "首见建规范条目，异名归并，合并永远人工确认，同名异物拆开登记。" },
  { tab: "⑤ 蒸馏与断言验证", dir: "6_蒸馏与断言验证", cap: "主/补逐篇蒸馏进 entries.jsonl，线索层断言逐条核查，证实、证伪、查无三态闭环。" },
  { tab: "⑥ 终态资产总览", dir: "7_终态资产总览", cap: "10 篇走完管道后剩下的 8 类资产，随每篇过卡实时增长。" },
];
const N = 151;
const DOCS = [ ["CAE IOS 用户手册",15],["博客测评文",13],["培训讲义",15],["民航新闻稿",9],["A320 FCOM 节选",15],["播客转录稿",13],["论坛经验帖",15],["IOS SDK 接口文档",15],["行业综述文章",13],["旧版手册 v9",15] ];

let f = 0, vi = 0, playing = false, timer = null, speed = 1;
const img = document.getElementById("img"), bar = document.getElementById("bar"), fno = document.getElementById("fno");
const tabsEl = document.getElementById("tabs");
VIEWS.forEach((v, i) => {
  const b = document.createElement("button");
  b.className = "tab" + (i === 0 ? " cur" : "");
  b.textContent = v.tab;
  b.onclick = () => { vi = i; document.querySelectorAll(".tab").forEach(x => x.classList.remove("cur")); b.classList.add("cur"); render(); preload(); };
  tabsEl.appendChild(b);
});

function pad(n) { return String(n).padStart(3, "0"); }
function docAt(f) {
  if (f < 5) return "建仓初始化";
  let acc = 5;
  for (let i = 0; i < DOCS.length; i++) {
    if (f < acc + DOCS[i][1]) return `第 ${i + 1} 篇 / 共 10 篇 · ${DOCS[i][0]}`;
    acc += DOCS[i][1];
  }
  return "10 篇处理完毕，终态盘点";
}
function render() {
  img.src = encodeURI(`${VIEWS[vi].dir}/frames/f${pad(f)}.png`);
  bar.value = f;
  fno.textContent = `f${pad(f)} / 150`;
  document.getElementById("flabel").textContent = docAt(f);
  document.getElementById("cap").textContent = VIEWS[vi].cap;
}
function preload() { for (let i = 0; i < N; i++) { const im = new Image(); im.src = encodeURI(`${VIEWS[vi].dir}/frames/f${pad(i)}.png`); } }
function step(d) { f = (f + d + N) % N; render(); }
function play() {
  playing = !playing;
  document.getElementById("play").textContent = playing ? "⏸ 暂停" : "▶ 播放";
  if (playing) timer = setInterval(() => { if (f >= N - 1) { play(); return; } step(1); }, 300 / speed);
  else clearInterval(timer);
}
document.getElementById("play").onclick = play;
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
bar.oninput = () => { f = +bar.value; render(); };
document.getElementById("spd").onclick = () => {
  speed = speed >= 4 ? 0.5 : speed * 2;
  document.getElementById("spd").textContent = "速度 " + speed + "x";
  if (playing) { clearInterval(timer); timer = setInterval(() => { if (f >= N - 1) { play(); return; } step(1); }, 300 / speed); }
};
document.addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); play(); }
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
render(); preload();
</script>
</body>
</html>
